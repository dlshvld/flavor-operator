---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: flavor-operator
# description will be included in the image's metadata
description: A Personal OS image based off of Aurora.

# the base image to build on top of (FROM) and the version tag to use
# Using Aurora
base-image: ghcr.io/ublue-os/aurora
image-version: stable # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        # Brave Browser
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        # luisbocanegra
        - https://download.opensuse.org/repositories/home:luisbocanegra/Fedora_44/home:luisbocanegra.repo
        # LibreWolf
        - https://repo.librewolf.net/librewolf.repo
      copr:
        - atim/starship
        - imput/helium
        - matinlotfali/KDE-Rounded-Corners
        - wezfurlong/wezterm-nightly
      keys:
        # Brave Browser
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      install-weak-deps: false
      packages:
        - wezterm
        - starship
        - lsd
        - helix
        - helix-themes
        - brave-origin
        - librewolf
        - helium-bin
        - syncthing
        - nextcloud-client
        - torbrowser-launcher
        - kwin-effect-roundcorners
        - kde-material-you-colors
        - plasma-panel-colorizer
    remove:
      auto-remove: true
      packages:
        - firefox

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        install:
          - org.cryptomator.Cryptomator
          - com.bitwarden.desktop
          - org.keepassxc.KeePassXC
          - com.logseq.Logseq
          - org.inkscape.Inkscape
          - org.gimp.GIMP
          - org.musicbrainz.Picard
          - org.speedcrunch.SpeedCrunch
          - org.videolan.VLC
          - org.signal.Signal

  - type: fonts
    fonts:
      nerd-fonts:
        - SpaceMono
      google-fonts:
        - Manrope
        - Zilla Slab
      url-fonts:
        - name: Inter
          url: https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip

  - type: chezmoi
    repository: https://codeberg.org/dlshvld/dot
    all-users: false
    file-conflict-policy: replace

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
